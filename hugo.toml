baseURL = 'https://codevyr.github.io/'
languageCode = 'en-us'
title = 'Codevyr - Source code analysis and visualization'
relativeURLs = true
canonifyURLs = true

[module]
    [[module.imports]]
        path = "github.com/colinwilson/lotusdocs"
        disable = false
    [[module.imports]]
        path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
        disable = false
    [[module.imports]]
        path = "github.com/divinerites/plausible-hugo"
    [[module.mounts]]
        source = "content"
        target = "content"
    [[module.mounts]]
        source = "content/docs"
        target = "content/docs"

[params]
    description = "Codevyr helps engineering teams query, analyze, and visualize codebases using the Askl language."
    company = "Codevyr"
    contactEmail = "codevyr@gmail.com"
    keywords = ["code analysis", "askl", "developer tools", "code visualization", "graph explorer"]
    version = "0.1.0"
    # Site meta - favicon will be generated from logo or use static/favicon.png
    [params.meta]
    favicon = true
    faviconVersion = "1"
    svg = false

    # Social and external links
    [params.social]
        github = "codevyr/codevyr"

# Menu configuration
[menu]
    [[menu.primary]]
        name = "Docs"
        url = "/docs/"
        weight = 10
    

# LotussDocs theme configuration
[params.lotusdocs]
    version = "0.3.0"
    docsRepo = "https://github.com/codevyr/codevyr"
    docsRepoBranch = "main"
    docsRepoSubPath = ""
    editPage = true
    showToC = true
    tocSide = "left"

[params.footer]
    copyright = "© 2025, Codevyr, Maksym Planeta"
    version = true

[markup]
  [markup.highlight]
    style = "friendly"
