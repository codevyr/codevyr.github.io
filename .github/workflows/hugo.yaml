name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ main ]   # change if you deploy from another branch
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Every job reads the repository and nothing else, unless it says otherwise.
# Only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true          # fetch theme submodule if used
          fetch-depth: 0

      # Hugo 0.170.0 dropped the extended edition and LibSass with it, so there
      # is one archive and the theme's stylesheet needs Dart Sass on the PATH
      # (next step). Raise the two versions together, and build the site
      # locally with both before pinning them.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.170.1'

      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: '1.108.2'
          DART_SASS_SHA256: '32d2eb5b83cbc180fce9657ff3c57401a9006c59eccfe0bfdde0aa755a66d42f'
        run: |
          archive="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${archive}"
          echo "${DART_SASS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local"
          tar -C "${HOME}/.local" -xzf "${RUNNER_TEMP}/${archive}"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      # Optional: cache Hugo resources (faster builds)
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/*') }}

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
